<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Accountant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Monthly Expenses</h1>
    <div>
      <a href="/recurring" class="btn btn-outline-secondary me-2">Recurring Payments</a>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#generateModal">+ New Month</button>
    </div>
  </div>

  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div th:if="${#lists.isEmpty(expenses)}" class="alert alert-info">No expenses recorded yet.</div>

  <!-- Year Tabs -->
  <ul th:if="${!#maps.isEmpty(expensesByYear)}" class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" th:each="yearEntry, yIter : ${expensesByYear}">
      <button class="nav-link" th:classappend="${yIter.last} ? 'active' : ''"
              th:id="'tab-' + ${yearEntry.key}"
              data-bs-toggle="tab"
              th:attr="data-bs-target='#pane-' + ${yearEntry.key}"
              type="button" role="tab"
              th:text="${yearEntry.key}"></button>
    </li>
  </ul>

  <div th:if="${!#maps.isEmpty(expensesByYear)}" class="tab-content">
    <div th:each="yearEntry, yIter : ${expensesByYear}"
         class="tab-pane fade"
         th:classappend="${yIter.last} ? 'show active' : ''"
         th:id="'pane-' + ${yearEntry.key}"
         role="tabpanel">
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="expense : ${yearEntry.value}">
          <div class="card h-100 shadow-sm">
            <a th:href="@{/month/{ym}(ym=${expense.yearMonth})}" class="text-decoration-none text-body">
              <div class="card-body">
                <h5 class="card-title" th:text="${expense.expenseName}"
                    data-bs-toggle="tooltip" data-bs-placement="top"
                    th:title="${#temporals.format(expense.startDate, 'dd MMM')} + ' → ' + ${#temporals.format(expense.endDate, 'dd MMM')}"></h5>
                <ul class="list-unstyled mb-0">
                  <li><strong>Income:</strong> <span th:text="${#numbers.formatDecimal(expense.statistics.cashTotal, 1, 2)}"></span></li>
                  <li><strong>Cash Left:</strong> <span th:text="${#numbers.formatDecimal(expense.statistics.cashLeft, 1, 2)}"></span></li>
                  <li><strong>Fixed:</strong> <span th:text="${#numbers.formatDecimal(expense.statistics.fixedExpenseTotal, 1, 2)}"></span></li>
                </ul>
              </div>
            </a>
            <div class="card-footer bg-transparent border-0 text-end">
              <button class="btn btn-sm btn-outline-secondary me-1" data-bs-toggle="modal"
                      th:attr="data-bs-target='#editDatesModal-' + ${expense.yearMonth}">Edit Dates
              </button>
              <form th:action="@{/month/delete/{ym}(ym=${expense.yearMonth})}" method="post" style="display:inline;"
                    onsubmit="return confirm('Delete this month?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Dates Modals -->
<div th:each="expense : ${expenses}">
  <div class="modal fade" th:id="'editDatesModal-' + ${expense.yearMonth}" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form method="post" th:action="@{/month/editdates/{ym}(ym=${expense.yearMonth})}">
          <div class="modal-header">
            <h5 class="modal-title">Edit Period Dates</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-control" name="startDate" th:value="${expense.startDate}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">End Date (optional)</label>
              <input type="date" class="form-control" name="endDate" th:value="${expense.endDate}">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Generate New Month Modal -->
<div class="modal fade" id="generateModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="/month/generate">
        <div class="modal-header">
          <h5 class="modal-title">Generate New Month</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Name (optional)</label>
            <input type="text" class="form-control" name="expenseName" placeholder="e.g. June 2026">
          </div>
          <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" name="startDate" required>
          </div>
          <div class="mb-3">
            <label class="form-label">End Date (optional)</label>
            <input type="date" class="form-control" name="endDate">
          </div>
          <div th:if="${!recurringTemplates.isEmpty()}" class="mb-3">
            <label class="form-label">Pull Recurring Payments</label>
            <div th:each="template : ${recurringTemplates}" class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" name="templateIds" th:value="${template.id}"
                     th:id="'gen-tmpl-' + ${template.id}">
              <label class="form-check-label" th:for="'gen-tmpl-' + ${template.id}"
                     th:text="${template.name} + ' (' + ${#numbers.formatDecimal(template.defaultAmount, 1, 2)} + ')'"></label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Generate</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
</script>
</body>
</html>
