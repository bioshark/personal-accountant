<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Accountant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Monthly Expenses</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#generateModal">+ New Month</button>
  </div>

  <div th:if="${#lists.isEmpty(expenses)}" class="alert alert-info">No expenses recorded yet.</div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" th:each="expense : ${expenses}">
      <a th:href="@{/month/{ym}(ym=${expense.yearMonth})}" class="text-decoration-none">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title" th:text="${expense.expenseName}"></h5>
            <ul class="list-unstyled mb-0">
              <li><strong>Income:</strong> <span th:text="${#numbers.formatDecimal(expense.statistics.cashTotal, 1, 2)}"></span></li>
              <li><strong>Cash Left:</strong> <span th:text="${#numbers.formatDecimal(expense.statistics.cashLeft, 1, 2)}"></span></li>
              <li><strong>Fixed:</strong> <span th:text="${#numbers.formatDecimal(expense.statistics.fixedExpenseTotal, 1, 2)}"></span></li>
            </ul>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>

<!-- Generate New Month Modal -->
<div class="modal fade" id="generateModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="/month/generate">
        <div class="modal-header">
          <h5 class="modal-title">Generate New Month</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Name (optional)</label>
            <input type="text" class="form-control" name="expenseName" placeholder="e.g. June 2026">
          </div>
          <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" name="startDate" required>
          </div>
          <div class="mb-3">
            <label class="form-label">End Date (optional)</label>
            <input type="date" class="form-control" name="endDate">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Generate</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
