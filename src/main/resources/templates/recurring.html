<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recurring Payments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <a href="/" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Recurring Payments</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTemplateModal">+ Add Template</button>
  </div>

  <div th:if="${templates.isEmpty()}" class="alert alert-info">No recurring payments defined yet.</div>

  <table th:if="${!templates.isEmpty()}" class="table table-sm">
    <thead>
    <tr>
      <th>Name</th>
      <th>Default Amount</th>
      <th>Category</th>
      <th>Type</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="template, iter : ${templates}">
      <td th:text="${template.name}"></td>
      <td th:text="${#numbers.formatDecimal(template.defaultAmount, 1, 2)}"></td>
      <td th:text="${template.category.displayName}"></td>
      <td th:text="${template.type.displayName}"></td>
      <td class="text-end text-nowrap">
        <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal"
                th:attr="data-bs-target='#editTemplateModal-' + ${iter.index}">&#9998;
        </button>
        <form method="post" th:action="@{/recurring/delete/{id}(id=${template.id})}" style="display:inline;"
              onsubmit="return confirm('Delete this template?');">
          <button type="submit" class="btn btn-sm btn-outline-danger">&times;</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<!-- Add Template Modal -->
<div class="modal fade" id="addTemplateModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="/recurring/add">
        <div class="modal-header">
          <h5 class="modal-title">Add Recurring Payment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Default Amount</label>
            <input type="number" step="0.01" class="form-control" name="defaultAmount" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" name="category" required>
              <option th:each="cat : ${T(org.roly.personalaccountant.domain.model.dto.Payment.Category).values()}"
                      th:value="${cat}" th:text="${cat.displayName}"></option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" name="type" required>
              <option th:each="pt : ${T(org.roly.personalaccountant.domain.model.dto.Payment.PaymentType).values()}"
                      th:value="${pt}" th:text="${pt.displayName}"></option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit Template Modals -->
<div th:each="template, iter : ${templates}">
  <div class="modal fade" th:id="'editTemplateModal-' + ${iter.index}" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form method="post" th:action="@{/recurring/edit/{id}(id=${template.id})}">
          <div class="modal-header">
            <h5 class="modal-title">Edit Recurring Payment</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" name="name" th:value="${template.name}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Default Amount</label>
              <input type="number" step="0.01" class="form-control" name="defaultAmount" th:value="${template.defaultAmount}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select class="form-select" name="category" required>
                <option th:each="cat : ${T(org.roly.personalaccountant.domain.model.dto.Payment.Category).values()}"
                        th:value="${cat}" th:text="${cat.displayName}" th:selected="${cat == template.category}"></option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Type</label>
              <select class="form-select" name="type" required>
                <option th:each="pt : ${T(org.roly.personalaccountant.domain.model.dto.Payment.PaymentType).values()}"
                        th:value="${pt}" th:text="${pt.displayName}" th:selected="${pt == template.type}"></option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
