<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${expense.expenseName}">Month Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-light">
<div class="container py-4">
  <a href="/" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>
  <h1 th:text="${expense.expenseName}"></h1>

  <!-- Summary -->
  <div class="row g-3 my-3">
    <div class="col-md-4">
      <div class="card text-bg-success">
        <div class="card-body">
          <h6 class="card-title">Total Income</h6>
          <p class="card-text fs-4" th:text="${#numbers.formatDecimal(expense.statistics.cashTotal, 1, 2)}"></p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-bg-info">
        <div class="card-body">
          <h6 class="card-title">Cash Left</h6>
          <p class="card-text fs-4" th:text="${#numbers.formatDecimal(expense.statistics.cashLeft, 1, 2)}"></p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-bg-warning">
        <div class="card-body">
          <h6 class="card-title">Fixed Expenses</h6>
          <p class="card-text fs-4" th:text="${#numbers.formatDecimal(expense.statistics.fixedExpenseTotal, 1, 2)}"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Incomes -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Incomes</h5>
      <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#addIncomeModal">+ Add Income</button>
    </div>
    <div class="card-body" id="income-list">
      <div th:if="${expense.incomes.isEmpty()}" class="text-muted">No incomes recorded.</div>
      <table th:if="${!expense.incomes.isEmpty()}" class="table table-sm mb-0">
        <thead>
        <tr>
          <th>Source</th>
          <th>Date</th>
          <th class="text-end">Amount</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="income : ${expense.incomes}">
          <td th:text="${income.source}"></td>
          <td th:text="${income.date}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(income.value, 1, 2)}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Payments by Day -->
  <h4 class="mb-3">Payments</h4>
  <div class="accordion" id="paymentsAccordion">
    <div class="accordion-item" th:each="entry, iter : ${expense.payments}">
      <h2 class="accordion-header position-relative">
        <button class="accordion-button collapsed" type="button"
                data-bs-toggle="collapse"
                th:attr="data-bs-target='#day-' + ${iter.index}"
                th:style="${expense.statistics.dailyPayments[entry.key]?.weekEnd} ? 'background-color: #e9ecef;' : ''"
                th:text="${#temporals.format(entry.key, 'dd MMM, EEEE')}">
        </button>
        <span class="position-absolute top-50 translate-middle-y d-flex"
              style="right: 3rem; z-index: 3;">
          <span class="badge bg-secondary d-inline-block text-center"
                style="width: 10rem;"
                th:text="'Spent: ' + ${#numbers.formatDecimal(expense.statistics.dailyPayments[entry.key]?.dailyTotalExpenditure ?: 0.0, 1, 1)}"></span>
          <span class="badge d-inline-block text-center ms-1"
                style="width: 10rem;"
                th:classappend="${expense.statistics.dailyPayments[entry.key]?.dailyDifference ?: 0.0} >= 0 ? 'bg-success' : 'bg-danger'"
                th:text="'Diff: ' + ${#numbers.formatDecimal(expense.statistics.dailyPayments[entry.key]?.dailyDifference ?: 0.0, 1, 1)}"></span>
        </span>
      </h2>
      <div th:id="'day-' + ${iter.index}" class="accordion-collapse collapse" data-bs-parent="#paymentsAccordion">
        <div class="accordion-body">
          <div th:if="${entry.value.isEmpty()}" class="text-muted">No payments.</div>
          <table th:if="${!entry.value.isEmpty()}" class="table table-sm">
            <thead>
            <tr>
              <th>Description</th>
              <th>Category</th>
              <th>Type</th>
              <th class="text-end">Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="payment : ${entry.value}">
              <td th:text="${payment.description}"></td>
              <td th:text="${payment.category}"></td>
              <td th:text="${payment.type}"></td>
              <td class="text-end" th:text="${#numbers.formatDecimal(payment.amount, 1, 2)}"></td>
            </tr>
            </tbody>
          </table>
          <button class="btn btn-sm btn-outline-primary mt-2" data-bs-toggle="modal" data-bs-target="#addPaymentModal"
                  th:attr="onclick='document.getElementById(\'paymentDate\').value = \'' + ${entry.key} + '\''">+ Add Payment
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Income Modal -->
<div class="modal fade" id="addIncomeModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="/month/addincome">
        <div class="modal-header">
          <h5 class="modal-title">Add Income</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Source</label>
            <input type="text" class="form-control" name="source" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="date" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" name="value" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Add Payment Modal -->
<div class="modal fade" id="addPaymentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="/month/addpayment">
        <div class="modal-header">
          <h5 class="modal-title">Add Payment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" name="description" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" name="category" required>
              <option th:each="cat : ${T(org.roly.personalaccountant.domain.model.dto.Payment.Category).values()}"
                      th:value="${cat}" th:text="${cat}"></option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" name="type" required>
              <option th:each="pt : ${T(org.roly.personalaccountant.domain.model.dto.Payment.PaymentType).values()}"
                      th:value="${pt}" th:text="${pt}"></option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" name="amount" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="date" id="paymentDate" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
