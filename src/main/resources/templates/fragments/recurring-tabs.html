<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--/* Tabbed recurring-template checkboxes. All panes stay inside the surrounding form, so ticks on every tab are submitted. */-->
<div th:fragment="tabs(byType, prefix)">
  <ul class="nav nav-tabs nav-fill mb-2" role="tablist">
    <li class="nav-item" th:each="typeEntry, tIter : ${byType}">
      <button class="nav-link py-1" th:classappend="${tIter.first} ? 'active' : ''" type="button" role="tab" data-bs-toggle="tab"
              th:attr="data-bs-target='#' + ${prefix} + '-' + ${typeEntry.key.name().toLowerCase()}">
        <span th:text="${typeEntry.key.displayName}"></span>
        <span class="badge rounded-pill fw-normal ms-1" style="color: inherit; background: transparent; border: 1px solid currentColor;"
              th:text="${typeEntry.value.size()}"></span>
      </button>
    </li>
  </ul>
  <div class="tab-content">
    <div th:each="typeEntry, tIter : ${byType}" class="tab-pane fade" role="tabpanel"
         th:classappend="${tIter.first} ? 'show active' : ''"
         th:id="${prefix} + '-' + ${typeEntry.key.name().toLowerCase()}">
      <div th:if="${typeEntry.value.isEmpty()}" class="text-muted small">
        No <span th:text="${typeEntry.key.displayName.toLowerCase()}"></span> recurring payments.
      </div>
      <div th:each="template : ${typeEntry.value}" class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch" name="templateIds" th:value="${template.id}"
               th:id="${prefix} + '-tmpl-' + ${template.id}">
        <label class="form-check-label" th:for="${prefix} + '-tmpl-' + ${template.id}"
               th:text="${template.name} + ' (' + ${#numbers.formatDecimal(template.defaultAmount, 1, 2)} + ')'"></label>
      </div>
    </div>
  </div>
</div>
</body>
</html>
