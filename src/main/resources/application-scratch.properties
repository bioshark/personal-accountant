# Scratch profile for AUTHORING Flyway migrations against a disposable database.
#
# Use this while you are still writing/iterating a migration (e.g. V2). The scratch
# database can be deleted at any time; on the next boot Flyway re-applies V1..Vn from
# scratch, so you never hit checksum mismatches or need history surgery.
#
# Run:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=scratch
# (or in IntelliJ: add  scratch  to the run configuration's "Active profiles")
#
# Reset (wipe and start clean):
#   ./scripts/scratch-reset.sh
#
# When the migration is final and stable, switch back to the default profile so it
# applies once to your real dev database.
spring.datasource.url=jdbc:h2:file:./data/scratch
